[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-inference"
version = "0.3.0"
description = "Production-grade local inference gateway for the Jarvis stack"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
  "pydantic==2.13.5",
  "psutil==7.2.2",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.16,<1",
  "build>=1.2,<2",
]

[tool.setuptools.packages.find]
include = ["inference*"]
exclude = ["tests*", "docker*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
