services:
  ollama:
    image: ollama/ollama:0.35.1@sha256:17e945f1aa6e505707eeb621e3f36847d0a4a063d4778f7007645acccfb8bd4f
    container_name: jarvis-ollama
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama:/root/.ollama
    cpus: ${OLLAMA_CPUS:-2.75}
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-9g}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  jarvis-inference:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: jarvis-inference
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - ../.env
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INFERENCE_PORT:-8080}:8080"
    cpus: ${INFERENCE_CPUS:-0.50}
    mem_limit: ${INFERENCE_MEMORY_LIMIT:-512m}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      OLLAMA_URL: http://ollama:11434
      INFERENCE_HOST: 0.0.0.0
      INFERENCE_PORT: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  ollama:
