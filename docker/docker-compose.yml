services:
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama:/root/.ollama
    cpus: ${OLLAMA_CPUS:-3.0}
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-10g}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  jarvis-inference:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: jarvis-inference
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INFERENCE_PORT:-8080}:8080"
    cpus: ${INFERENCE_CPUS:-3.0}
    mem_limit: ${INFERENCE_MEMORY_LIMIT:-2g}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    environment:
      OLLAMA_URL: http://ollama:11434
      INFERENCE_HOST: 0.0.0.0
      INFERENCE_PORT: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  ollama:
